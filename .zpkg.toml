[package]
org = "oresoftware"
name = "rx-gleam"
version = "0.1.0"
description = "Serialized single-actor Reactive Extensions for Gleam"
license = "MIT"
keywords = ["gleam", "reactive", "rxjs", "reactivex", "beam"]

[package.repository]
vcs = "git"
url = "https://github.com/ORESoftware/rx-gleam"

[install]
dir = ".vendor/.zed"

[targets.repository]
dir = "."
adapter = "none"

[targets.gleam]
dir = "."
name = "rx_gleam"
adapter = "none"

[scripts]
format = "gleam format --check src test"
test = "gleam test"
conformance = "sh ./conformance/check.sh --full"
check = "gleam format --check src test && gleam test && sh ./conformance/check.sh --full"

[hooks]
post_install = "sh ./conformance/check.sh --quick"
pre_publish = "sh ./conformance/check.sh --full"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = ["build/**", ".vendor/.zed/**", "zed_modules/**", ".git/**", "**/*.log", ".DS_Store"]
