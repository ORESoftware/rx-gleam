[package]
org = "oresoftware"
name = "rx-gleam"
version = "0.1.0"
description = "Serialized single-actor Reactive Extensions for Gleam"
license = "MIT"
keywords = ["gleam", "reactive", "rxjs", "reactivex", "beam"]

[package.repository]
vcs = "git"
url = "https://github.com/ORESoftware/rx-gleam"

[install]
dir = ".vendor/.zed"

[targets.repository]
dir = "."
adapter = "none"

[targets.gleam]
dir = "."
adapter = "none"

[hooks]
pre-install = ["sh ./scripts/zed-pre-install.sh"]
post-install = ["sh ./scripts/zed-post-install.sh"]

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "sh ./conformance/package-smoke.sh"
exclude = ["build/**", ".vendor/.zed/**", "zed_modules/**", ".git/**", "**/*.log", ".DS_Store"]
