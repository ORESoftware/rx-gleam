[package]
org = "oresoftware"
name = "rx-gleam"
version = "0.1.0"
description = "Serialized single-actor Reactive Extensions for Gleam"
license = "MIT"
keywords = ["gleam", "reactive", "rxjs", "reactivex", "beam"]

[package.repository]
vcs = "git"
url = "https://github.com/ORESoftware/rx-gleam"

[install]
dir = ".vendor/.zed"
adapter = "none"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "sh -c 'f=$(find -L zed_modules -type f -path \"*/src/rx.gleam\" -print -quit); test -n \"$f\" && d=$(dirname \"$(dirname \"$f\")\") && test -f \"$d/gleam.toml\" && grep -q \"pub opaque type Observable\" \"$f\"'"
exclude = ["build/**", ".vendor/.zed/**", "zed_modules/**", ".git/**", "**/*.log", ".DS_Store"]

[publish.native]
registry = "hex"
package = "rx_gleam"
