name: repair-zed-v0.1.1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/repair-zed-v0.1.1.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  ZED_VERSION: '0.3.0'
  ZED_ARCHIVE_SHA256: 'e380240c96242ab3b29e0e9d14c95ba946d086f20f0732e34d0e5cf47513efc7'
  RELEASE_SHA: '110411526a780cfaa806a559c283c82b37c12dfb'
  ZED_PKG_REGISTRY: 'https://registry.zpkg.net'

jobs:
  validate-repair-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate bounded authoritative repair contract
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/repair-zed-v0.1.1.yml
          grep -qF "ZED_PKG_REGISTRY: 'https://registry.zpkg.net'" "$workflow"
          grep -qF "RELEASE_SHA: '110411526a780cfaa806a559c283c82b37c12dfb'" "$workflow"
          grep -qF "ZED_PKG_SOURCE_FALLBACK: '0'" "$workflow"
          grep -qF 'github.event_name == '\''workflow_dispatch'\''' "$workflow"
          grep -qF 'expected HTTP 404 after successful token authentication' "$workflow"
          git diff --check HEAD^ HEAD

  publish-zed-v0-1-1:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-repair-contract
    runs-on: ubuntu-24.04
    environment: zed-pkg
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: v0.1.1
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(awk -F'"' '/^version = / { print $2; exit }' gleam.toml)" = '0.1.1'
          test "$(awk -F'"' '/^version = / { print $2; exit }' .zpkg.toml)" = '0.1.1'
          test -z "$(git status --porcelain)"

      - name: Require a live production registry token
        shell: bash
        env:
          ZED_PKG_TOKEN: ${{ secrets.ZED_PKG_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$ZED_PKG_TOKEN" ]; then
            echo '::error title=Missing Zed registry token::The protected zed-pkg environment must expose ZED_PKG_TOKEN.' >&2
            exit 1
          fi

          config="$RUNNER_TEMP/zed-registry-auth.curl"
          trap 'rm -f "$config"' EXIT
          umask 077
          printf 'header = "Authorization: Bearer %s"\n' "$ZED_PKG_TOKEN" > "$config"
          probe_org="rx-gleam-auth-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          status=$(curl --config "$config" --silent --show-error --max-time 15 \
            --output "$RUNNER_TEMP/zed-registry-auth.body" --write-out '%{http_code}' \
            "$ZED_PKG_REGISTRY/v1/orgs/$probe_org/audit?limit=1" || true)

          case "$status" in
            404)
              echo 'Production Zed registry accepted the bearer token (expected HTTP 404 after successful token authentication).'
              ;;
            401)
              echo '::error title=Zed registry token rejected::ZED_PKG_TOKEN is present but registry.zpkg.net does not recognize it, or it is revoked/expired. Rotate the protected zed-pkg environment token before rerunning this manual repair.' >&2
              exit 1
              ;;
            *)
              echo "::error title=Zed registry auth preflight failed::Expected authenticated probe HTTP 404, got HTTP ${status:-none}." >&2
              exit 1
              ;;
          esac

      - name: Install checksum-pinned Zed v0.3.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zed.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/zed-pkg/zed-cli/releases/download/v${ZED_VERSION}/zed-x86_64-unknown-linux-musl.tar.gz" \
            -o "$archive"
          echo "${ZED_ARCHIVE_SHA256}  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/zed-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/zed-bin"
          echo "$RUNNER_TEMP/zed-bin" >> "$GITHUB_PATH"

      - name: Publish immutable v0.1.1 artifact to authoritative Zed registry
        shell: bash
        env:
          ZED_PKG_TOKEN: ${{ secrets.ZED_PKG_TOKEN }}
          ZED_PKG_GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          ZED_PKG_SOURCE_FALLBACK: '0'
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          zed validate
          zed publish
