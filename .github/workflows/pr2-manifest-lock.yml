name: pr2 canonical gleam manifest

on:
  pull_request:

permissions:
  contents: write

jobs:
  lock:
    if: github.event.pull_request.number == 2 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '28'
          gleam-version: '1.18.0'
          rebar3-version: '3'
      - name: Resolve canonical dependency manifest
        run: gleam deps download
      - name: Commit manifest when needed
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test -f manifest.toml
          if git diff --quiet -- manifest.toml && git ls-files --error-unmatch manifest.toml >/dev/null 2>&1; then
            echo 'manifest.toml is already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.toml
          git commit -m 'chore: lock Gleam dependencies'
          git push origin "HEAD:${HEAD_REF}"
