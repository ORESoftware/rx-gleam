name: pr2 canonical gleam format

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.number == 2 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          gleam-version: '1.18.0'
          rebar3-version: '3'
      - name: Apply canonical Gleam formatting
        run: gleam format src test
      - name: Commit formatting when needed
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- src test; then
            echo 'Formatting already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src test
          git commit -m 'style: apply canonical Gleam formatting'
          git push origin "HEAD:${HEAD_REF}"
