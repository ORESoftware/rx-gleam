name: format diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - src/rx/flow_model.gleam
      - .github/workflows/format-diagnostic.yml

permissions:
  contents: read

jobs:
  formatter-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '28'
          gleam-version: '1.18.1'
          rebar3-version: '3'
      - name: Print canonical formatter diff
        shell: bash
        run: |
          set -euo pipefail
          gleam format src/rx/flow_model.gleam
          git --no-pager diff -- src/rx/flow_model.gleam
