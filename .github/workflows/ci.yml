name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          gleam-version: '1.12.0'
          rebar3-version: '3'
      - name: Format
        run: gleam format --check src test
      - name: Test
        run: gleam test
      - name: Structural conformance
        run: sh conformance/check.sh --quick
