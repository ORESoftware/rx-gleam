name: ci

on:
  push:

permissions:
  contents: write

jobs:
  normalize:
    if: github.ref == 'refs/heads/audit/harden-rx-gleam'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1"
          gleam-version: "1.18.1"
          rebar3-version: "3"

      - name: Normalize Gleam source and tests
        run: |
          gleam format src test
          git diff --check

      - name: Commit formatter output
        run: |
          if git diff --quiet -- src test; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test
          git commit -m "style: normalize hardening sources"
          git push
