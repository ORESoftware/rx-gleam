name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [erlang, javascript]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1"
          gleam-version: "1.18.1"
          rebar3-version: "3"

      - name: Download dependencies
        run: gleam deps download

      - name: Show formatter changes
        run: |
          gleam format src test
          git diff -- src test

      - name: Check ${{ matrix.target }} target
        run: gleam check --target ${{ matrix.target }}

      - name: Test ${{ matrix.target }} target
        run: gleam test --target ${{ matrix.target }}
