name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Detect Gleam package
        id: package
        shell: bash
        run: |
          if test -f gleam.toml; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Bootstrap main has no Gleam package yet; package checks are exercised on the feature PR.'
          fi
      - uses: erlef/setup-beam@v1
        if: steps.package.outputs.present == 'true'
        with:
          otp-version: '28'
          gleam-version: '1.18.0'
          rebar3-version: '3'
      - name: Format
        if: steps.package.outputs.present == 'true'
        run: gleam format --check src test
      - name: Test
        if: steps.package.outputs.present == 'true'
        run: gleam test
      - name: Structural conformance
        if: steps.package.outputs.present == 'true'
        run: sh conformance/check.sh --quick
