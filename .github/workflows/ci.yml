name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Detect Gleam package source tree
        id: package
        shell: bash
        run: |
          if test -f gleam.toml && test -d src && test -d test; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Package source tree is not on this ref yet; compiler checks are skipped.'
          fi
      - uses: erlef/setup-beam@v1
        if: steps.package.outputs.present == 'true'
        with:
          otp-version: '28'
          gleam-version: '1.18.0'
          rebar3-version: '3'
      - name: Normalize formatting for compiler feedback
        if: steps.package.outputs.present == 'true'
        run: gleam format src test
      - name: Show formatting diff
        if: steps.package.outputs.present == 'true'
        run: git diff -- src test
      - name: Test
        if: steps.package.outputs.present == 'true'
        run: gleam test
      - name: Structural conformance
        if: steps.package.outputs.present == 'true'
        run: sh conformance/check.sh --quick
      - name: Verify formatting is committed
        if: steps.package.outputs.present == 'true'
        run: git diff --exit-code -- src test

  format-pr2:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 2 && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          gleam-version: '1.18.0'
          rebar3-version: '3'
      - name: Apply canonical Gleam formatting
        run: gleam format src test
      - name: Commit formatting when needed
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- src test; then
            echo 'Formatting already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src test
          git commit -m 'style: apply canonical Gleam formatting'
          git push origin "HEAD:${HEAD_REF}"
