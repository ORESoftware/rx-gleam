name: ci

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up latest Gleam and OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1"
          gleam-version: "1.18.1"
          rebar3-version: "3"

      - name: Download dependencies
        run: gleam deps download

      - name: Normalize source and test layout
        run: |
          if [ -f test/rx_test.gleam ] && [ ! -f test/rx_gleam_test.gleam ]; then
            mv test/rx_test.gleam test/rx_gleam_test.gleam
          fi
          gleam format src test
          git diff --check
          git diff -- src test

      - name: Check Erlang target
        run: gleam check --target erlang

      - name: Test Erlang target
        run: gleam test --target erlang

      - name: Check JavaScript target
        run: gleam check --target javascript

      - name: Test JavaScript target
        run: gleam test --target javascript

      - name: Commit normalized sources
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/eager-lazy-reactive-core'
        run: |
          if git diff --quiet -- src test; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test
          git commit -m "style: normalize Gleam sources and test entrypoint"
          git push
